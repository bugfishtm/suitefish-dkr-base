[program:php-fpm]
command=php-fpm -F
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor_fpm_info.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor_fpm_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10